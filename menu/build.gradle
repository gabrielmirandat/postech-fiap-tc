plugins {
    id 'java-library'
    id 'io.quarkus' version '3.9.2'
    id 'org.openapi.generator' version '6.6.0' // Versão do OpenAPI Generator
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // A versão do Java configurada como 21
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    api libs.io.swagger.core.v3.swagger.annotations
    api libs.org.modelmapper.modelmapper
    api libs.io.cloudevents.cloudevents.core
    api libs.io.cloudevents.cloudevents.kafka
    api libs.io.cloudevents.cloudevents.json.jackson
    api libs.jakarta.validation.jakarta.validation.api
    api libs.jakarta.annotation.jakarta.annotation.api
    api libs.jakarta.persistence.jakarta.persistence.api
    api libs.io.opentelemetry.opentelemetry.api
    api libs.io.opentelemetry.opentelemetry.sdk
    api libs.io.opentelemetry.opentelemetry.exporter.otlp
    api libs.org.yaml.snakeyaml
    api libs.com.fasterxml.jackson.core.jackson.core
    api libs.com.fasterxml.jackson.core.jackson.databind
    api libs.com.fasterxml.jackson.core.jackson.annotations
    api libs.com.fasterxml.jackson.dataformat.jackson.dataformat.yaml
    api libs.com.fasterxml.jackson.module.jackson.module.scala.v2.v13
    api libs.com.gabriel.core
    api libs.io.quarkus.quarkus.resteasy
    api libs.io.quarkus.quarkus.hibernate.validator
    api libs.io.quarkus.quarkus.resteasy.jackson
    api libs.com.fasterxml.jackson.datatype.jackson.datatype.jsr310
    api libs.io.quarkus.quarkus.mongodb.client
    api libs.io.mongock.mongock.standalone
    api libs.io.mongock.mongodb.sync.v4.driver
    api libs.io.quarkus.quarkus.messaging.kafka
    api libs.javax.annotation.javax.annotation.api
    api libs.com.google.protobuf.protobuf.java
    api libs.io.quarkus.quarkus.grpc
    api libs.io.quarkus.quarkus.smallrye.health
    api libs.io.grpc.grpc.services
    api libs.io.grpc.grpc.protobuf
    api libs.io.grpc.grpc.stub
    testImplementation libs.io.cucumber.cucumber.java
    testImplementation libs.io.cucumber.cucumber.junit.platform.engine
    testImplementation libs.org.junit.platform.junit.platform.suite
    testImplementation libs.org.junit.jupiter.junit.jupiter
    testImplementation libs.org.junit.jupiter.junit.jupiter.api
    testImplementation libs.org.junit.jupiter.junit.jupiter.engine
    testImplementation libs.org.assertj.assertj.core
    testImplementation libs.io.rest.assured.rest.assured
    testImplementation libs.io.rest.assured.json.path
    testImplementation libs.io.rest.assured.json.schema.validator
    testImplementation libs.org.mockito.mockito.core
    testImplementation libs.org.mockito.mockito.junit.jupiter
    testImplementation libs.org.testcontainers.testcontainers
    testImplementation libs.org.testcontainers.junit.jupiter
    testImplementation libs.io.quarkus.quarkus.junit5
}

openApiGenerate {
    generatorName = "jaxrs-spec"
    inputSpec = "$rootDir/src/main/resources/oas/menu-api.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = "com.gabriel.specs.menu"
    modelPackage = "com.gabriel.specs.menu.models"
    configOptions = [
            openApiNullable      : "false",
            interfaceOnly        : "true",
            useBeanValidation    : "true",
            useOptional          : "true",
            library              : "quarkus",
            useJakartaEe         : "true",   // Linha chave para usar Jakarta
            useSwaggerAnnotations: "false"
    ]
    skipValidateSpec = false
}

sourceSets.main.java.srcDirs += "$buildDir/generated/src/gen/java"

quarkus {
    setOutputDirectory("$buildDir/quarkus")
    setPackageName("com.gabriel.menu")
    setFinalName("menu-application")  // Nome final do JAR
}

tasks.compileJava.dependsOn tasks.openApiGenerate