syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";   

message Price {
    // Value: Must be between 0.1 and 10000.0, not null
    double value = 1 [(buf.validate.field).double = {gte: 0.1, lt: 10000.0}, (buf.validate.field).required = true];
}