services:

  orders-service:
    container_name: postech_orders_service
    #    build: ./orders
    image: gabrielmirandat/orders:latest
    depends_on:
      - mongo
      - kafka
    ports:
      - "8001:8001"
    networks:
      - postech_network

  postgres:
    container_name: postech_postgres
    image: postgres:15.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postech_db
      POSTGRES_USER: dummy
      POSTGRES_PASSWORD: dummy
    networks:
      - postech_network

  mongo:
    container_name: postech_mongo
    image: mongo:6.0.6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dummy
      MONGO_INITDB_ROOT_PASSWORD: dummy
      MONGO_INITDB_DATABASE: postech_db
    networks:
      - postech_network

  redis:
    container_name: postech_redis
    image: redis:7.0.13-alpine
    ports:
      - "6379:6379"
    networks:
      - postech_network

  zookeeper:
    container_name: postech_zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - postech_network

  kafka:
    container_name: postech_kafka
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - postech_network

networks:
  postech_network:
    driver: bridge
