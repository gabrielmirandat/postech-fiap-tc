syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";

message Cellphone {
  // Cellphone: Must follow the pattern "(XX) XXXX-XXXX" or "(XX) XXXXX-XXXX" and not be blank
  string value = 1 [(buf.validate.field).cel = {
    id: "cellphone.value",
    message: "Cellphone number cannot be blank and must follow the pattern (XX) XXXX-XXXX or (XX) XXXXX-XXXX",
    expression: "size(this) > 0 && this.matches('\\(\\d{2}\\) \\d{4,5}-\\d{4}')"
  }];
}