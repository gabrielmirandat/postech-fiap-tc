syntax = "proto3";

package com.gabriel.models;

import "buf/validate/validate.proto";

// OrderID: Represents a unique identifier for orders
message OderID {
    // ID: Must follow the format [8 alphanumeric]-ORDR-[YYYY]-[MM]-[DD], exactly 20 characters
    string value = 1 [(buf.validate.field).string = {min_len: 20, max_len: 20, pattern: "[0-9a-f]{8}-ORDR-\\d{4}-\\d{2}-\\d{2}"}];
}