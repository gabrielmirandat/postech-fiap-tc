syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";

// OrderId: Represents a unique identifier for orders
message OrderId {
  // Value: Must follow the format [8 alphanumeric]-ORDR-[YYYY]-[MM]-[DD], exactly 20 characters
  string value = 1 [(buf.validate.field).cel = {
    id: "order_id.value",
    message: "Invalid Order Id format",
    expression: "this.matches(r'[0-9a-f]{8}-ORDR-\\d{4}-\\d{2}-\\d{2}')"
  }];
}