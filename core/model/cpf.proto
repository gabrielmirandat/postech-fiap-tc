syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";   

message Cpf {
    // Cpf: Must follow the pattern "XXX.XXX.XXX-XX" (e.g., "123.456.789-01") and not be blank
    string value = 1 [(buf.validate.field).string = {min_len: 1, pattern: "\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}"}];
}