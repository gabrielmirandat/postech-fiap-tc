syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";

// CustomerId: Represents a unique identifier for customers
message CustomerId {
  // Value: Must follow the format [8 alphanumeric]-CUST-[YYYY]-[MM]-[DD], exactly 20 characters
  string value = 1 [(buf.validate.field).cel = {
    id: "customer_id.value",
    message: "Invalid Customer ID format",
    expression: "size(this) == 20 && this.matches(r'[0-9a-f]{8}-CUST-\\d{4}-\\d{2}-\\d{2}')"
  }];
}