syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";

// Description: Represents an object description
message Description {
  // Value: Must be between 1 and 255 characters, not blank
  string value = 1 [(buf.validate.field).cel = {
    id: "description.value",
    message: "Description must be between 1 and 255 characters",
    expression: "size(this) >= 1 && size(this) <= 255 && this.matches('.*\\\\S.*')"
  }];
}