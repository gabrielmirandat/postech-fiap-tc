syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";

// Email: Represents a user's email address
message Email {
  // Value: Must be a valid email address and not blank
  string value = 1 [(buf.validate.field).cel = {
    id: "email.value",
    message: "Invalid email address format",
    expression: "size(this) > 0 && this.matches(r'^[\\w\\.-]+@[a-zA-Z\\d\\.-]+\\.[a-zA-Z]{2,}$')"
  }];
}