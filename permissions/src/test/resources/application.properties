# Test profile: disable OIDC so tests can run without Auth0
quarkus.oidc.tenant-enabled=false
quarkus.oidc.auth-server-url=https://test-issuer.example.com/
# Dummy Auth0 config so Quarkus boot does not require AUTH0_* env vars (e.g. in AuthorityRepositoryIntegrationTest)
auth0.issuer=https://test-issuer.example.com/
auth0.logout-url=http://localhost:8000
auth0.client-id=test-client-id
auth0.client-secret=test-client-secret
auth0.scope=test-scope
auth0.audience=test-audience
auth0.app-client-id=test-app-client-id
auth0.app-client-secret=test-app-client-secret
auth0.app-scope=test-app-scope
auth0.app-audience=test-app-audience
# H2 in-memory for tests; schema from Hibernate (Liquibase scripts are PostgreSQL-specific)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:permissions_test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.liquibase.migrate-at-start=false
