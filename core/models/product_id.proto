syntax = "proto3";

package com.gabriel.models;

import "buf/validate/validate.proto";

// ProductID: Represents a unique identifier for products
message ProductID {
    // ID: Must follow the format [8 alphanumeric]-PRDC-[YYYY]-[MM]-[DD], exactly 20 characters
    string value = 1 [(buf.validate.field).string = {min_len: 20, max_len: 20, pattern: "[0-9a-f]{8}-PRDC-\\d{4}-\\d{2}-\\d{2}"}];
}