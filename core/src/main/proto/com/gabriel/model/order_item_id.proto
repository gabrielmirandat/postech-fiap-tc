syntax = "proto3";
option java_multiple_files = true;

package com.gabriel.model;

import "buf/validate/validate.proto";

// OrderItemId: Represents a unique identifier for order items
message OrderItemId {
  // Value: Must follow the format [8 alphanumeric]-ORDI-[YYYY]-[MM]-[DD], exactly 20 characters
  string value = 1 [(buf.validate.field).cel = {
    id: "order_item_id.value",
    message: "Invalid Order Item ID format",
    expression: "this.matches(r'[0-9a-f]{8}-ORDI-\\d{4}-\\d{2}-\\d{2}')"
  }];
}